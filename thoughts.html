<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Thoughts | Raphael Peer</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/thoughts.css" />
    </head>
    <body>
        <header>
            <nav>
                <div class="nav-links">
                    <a href="/">home</a>
                    <a href="/thoughts.html" class="active">thoughts</a>
                    <a href="/about.html">about</a>
                </div>
            </nav>
        </header>

        <main class="about-main">
            <div class="content-container">
                <h1 class="page-title">thoughts</h1>

                <div class="directory-list">
                    <!-- Example Note 1 -->
                    <a href="/thoughts/lorem-ipsum.html" class="directory-item">
                        <span class="page-icon">📝</span>
                        <span class="page-name"
                            >Lorem ipsum dolor sit amet</span
                        >
                    </a>

                    <!-- Example Note 2 -->
                    <a
                        href="/thoughts/consectetur-adipiscing.html"
                        class="directory-item"
                    >
                        <span class="page-icon">💡</span>
                        <span class="page-name"
                            >Consectetur adipiscing elit, sed do eiusmod
                            tempor</span
                        >
                    </a>

                    <!-- Dummy Section for Testing -->
                    <div
                        style="
                            margin-top: 3rem;
                            padding-top: 2rem;
                            border-top: 1px solid rgba(255, 255, 255, 0.1);
                        "
                    >
                        <h3
                            style="
                                font-size: 1rem;
                                color: var(--text-secondary);
                                margin-bottom: 1rem;
                                font-weight: 400;
                            "
                        >
                            Example States (hardcoded colors)
                        </h3>

                        <!-- Regular (unvisited) example -->
                        <div class="directory-item">
                            <span class="page-icon">🔗</span>
                            <span
                                class="page-name"
                                style="color: var(--text-secondary)"
                                >Regular link (unvisited)</span
                            >
                        </div>

                        <!-- Visited example -->
                        <div class="directory-item">
                            <span class="page-icon">✅</span>
                            <span class="page-name" style="color: #7d8799"
                                >Visited link example</span
                            >
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
